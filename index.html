
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap und Sass</title>

    <link rel="stylesheet" href="dist/css/style.css">
</head>
<body>

    <div class="container">
        <h1>Bootstrap mit Sass</h1>
        <p>Mein erstes Bootstrap-Projekt</p>

        <h2>Grid-System</h2>

        <div class="row">
            <div class="md:col-6">
                <h3>Spalte 1</h3>
                <p>Das ist die erste Spalte.</p>
            </div>

            <div class="md:col-6">
                <h3>Spalte 2</h3>
                <p>Das ist die zweite Spalte.</p>
            </div>
        </div>

        <h2>Bootstrap Buttons</h2>

        <button class="btn-solid theme-primary">
            <i class="bi bi-rocket-takeoff" aria-hidden="true"></i>
            Primary
        </button>

        <button class="btn-outline theme-secondary">
            Secondary
        </button>

        <button class="btn-solid theme-success">
            <i class="bi bi-check-circle" aria-hidden="true"></i>
            Success
        </button>
    </div>

</body>
</html>
